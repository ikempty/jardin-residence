  <main id="main" class="out-main"><div class="out-deleted-note" role="status"><p>下書きを削除しました</p></div><article class="out-publication out-local"><header class="local-masthead"><strong>城西日報</strong><span>JOSEI NIPPO</span><time>2031年9月18日</time></header><div class="local-article"><p>社会</p><h1>世田渋谷区で震度6強　ジャルダン代々木下原の東棟が一部倒壊</h1><div class="out-copy"><p>世田渋谷区を襲った強い地震により、ジャルダン代々木下原の東棟が大きく傾き、建物の一部が倒壊した。</p><p>地下駐車場には大量の水が流れ込み、電気設備が停止した。消防によると、住民に死者と複数の負傷者が出ている。</p><p>現場では東側の地盤と基礎部分に大きな損傷が確認されている。区は、建設前の地盤調査と公開資料に問題がなかったか調査すると発表した。</p></div></div></article></main><footer class="out-footer" aria-hidden="true"></footer>
